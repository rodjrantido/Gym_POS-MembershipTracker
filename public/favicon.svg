<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff00" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Shield / Tile -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#27272a" stroke-width="4" />
  
  <!-- Stylized Gym Dumbbell / Barbell -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#glow)">
    <!-- Center Barbell Shaft -->
    <rect x="180" y="236" width="152" height="40" rx="8" fill="url(#grad)" />
    <!-- Bar Knurling Grips -->
    <line x1="230" y1="238" x2="230" y2="274" stroke="#09090b" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="238" x2="256" y2="274" stroke="#09090b" stroke-width="4" stroke-linecap="round" />
    <line x1="282" y1="238" x2="282" y2="274" stroke="#09090b" stroke-width="4" stroke-linecap="round" />
    
    <!-- Left Weight Plates -->
    <rect x="146" y="196" width="26" height="120" rx="10" fill="url(#grad)" />
    <rect x="106" y="166" width="32" height="180" rx="12" fill="url(#grad)" />
    <rect x="74" y="186" width="24" height="140" rx="8" fill="#a1a1aa" />
    <!-- Outer Collar -->
    <rect x="62" y="240" width="12" height="32" rx="4" fill="#71717a" />
    
    <!-- Right Weight Plates -->
    <rect x="340" y="196" width="26" height="120" rx="10" fill="url(#grad)" />
    <rect x="374" y="166" width="32" height="180" rx="12" fill="url(#grad)" />
    <rect x="414" y="186" width="24" height="140" rx="8" fill="#a1a1aa" />
    <!-- Outer Collar -->
    <rect x="438" y="240" width="12" height="32" rx="4" fill="#71717a" />
  </g>
  
  <!-- Pulse Accent Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#d4ff00" stroke-width="6" stroke-dasharray="24 16" opacity="0.4" />
</svg>